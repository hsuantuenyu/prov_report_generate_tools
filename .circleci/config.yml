version: 2.1

jobs:
  build-macos-arm64:
    macos:
      xcode: "16.4.0"
    resource_class: m4pro.medium   # Apple Silicon (arm64) 资源类
    environment:
      PROJECT_NAME: 疾控中心下发报告生成工具
      DIST_DIR: dist
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    steps:
      - checkout

      # 1. 查看 Python 与 tkinter 可用性（关键诊断）
      - run:
          name: Verify macOS ARM64 + Python tkinter
          command: |
            set -e
            echo "=== 工作目录 ==="
            pwd
            ls -la
            echo ""
            echo "=== 系统信息 ==="
            sw_vers
            echo "架构: $(uname -m)"
            echo ""
            echo "=== 预装 Python 信息 ==="
            /usr/bin/python3 --version
            /usr/bin/python3 -c "import platform; print('machine:', platform.machine())"
            echo "系统 Python tkinter 测试:"
            /usr/bin/python3 -c "import tkinter; print('tkinter OK:', tkinter.TkVersion)" 2>&1 || echo "系统 Python 无 tkinter"
            echo ""
            echo "=== Homebrew Python 检查 ==="
            brew --version 2>/dev/null || echo "brew 不可用"

      # 2. 用 Homebrew 安装带 Tcl/Tk 的 Python（系统 Python 缺少 tkinter）
      - run:
          name: Install Homebrew Python with Tcl/Tk
          command: |
            set -e
            echo "=== 安装 Homebrew python@3.12 + python-tk@3.12 + tcl-tk ==="
            brew install python@3.12 python-tk@3.12 tcl-tk
            echo ""
            echo "=== Homebrew Python 路径 ==="
            ls -la /opt/homebrew/bin/python3.12 2>/dev/null || ls -la /usr/local/bin/python3.12 2>/dev/null || true
            echo ""
            # 让 Homebrew Python 优先于系统 Python
            echo 'export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"' >> $BASH_ENV
            # 刷新环境
            export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
            echo "Python 版本:"
            python3 --version
            echo "Python 路径:"
            which python3
            echo ""
            echo "=== tkinter 验证（关键）==="
            python3 -c "import tkinter; print('tkinter OK, TkVersion:', tkinter.TkVersion)"
            python3 -c "import tkinter; tkinter.Tk().eval('info patchlevel'); print('Tcl/Tk patchlevel:', tkinter.Tcl().eval('info patchlevel'))"

      # 3. 安装项目依赖 + PyInstaller
      - run:
          name: Install dependencies
          command: |
            set -e
            python3 -m pip install --upgrade pip setuptools wheel
            echo "=== requirements.txt 内容 ==="
            cat requirements.txt
            python3 -m pip install -r requirements.txt
          environment:
            ARCHFLAGS: "-arch arm64"
            PIP_USE_PEP517: "1"

      - run:
          name: 验证依赖安装
          command: |
            set -e
            pip3 list 2>/dev/null | grep -iE "duckdb|pandas|openpyxl|tkcalendar|pyinstaller" || true
            echo ""
            echo "PyInstaller: $(pyinstaller --version)"
            echo "pyinstaller 路径: $(which pyinstaller)"

      # 4. 执行打包脚本
      - run:
          name: Build .app with build_exe.py
          command: |
            set -e
            echo "=== 构建前检查关键文件 ==="
            for f in report_generator.py report_generator.spec prov_report.db prov_generate_data.sql 疾控下发汇总报告模板.xlsx 版本日志.txt; do
              if [ -f "$f" ]; then
                echo "[OK] $f"
              else
                echo "[MISSING] $f"
              fi
            done
            echo ""
            echo "=== 执行 build_exe.py ==="
            python3 build_exe.py
          environment:
            TARGET_ARCH: "arm64"
            ARCHFLAGS: "-arch arm64"

      # 5. 校验产物架构 + tkinter 是否打包进去
      - run:
          name: Verify app architecture + tkinter
          command: |
            set -e
            APP="$DIST_DIR/${PROJECT_NAME}.app"
            BIN="$APP/Contents/MacOS/${PROJECT_NAME}"
            echo "=== dist 目录内容 ==="
            ls -la "$DIST_DIR/"
            echo ""
            if [ ! -f "$BIN" ]; then
              echo "❌ 未找到可执行文件: $BIN"
              ls -la "$APP/Contents/MacOS/" 2>/dev/null || true
              exit 1
            fi
            echo "=== file 命令 ==="
            file "$BIN"
            echo "=== lipo -info ==="
            lipo -info "$BIN" 2>/dev/null || true
            if file "$BIN" | grep -q "arm64"; then
              echo "✅ Apple Silicon arm64 架构验证通过"
            else
              echo "❌ 架构不符：期望 arm64"
              exit 1
            fi
            # 验证 .app 内是否包含 tkinter 相关文件
            echo ""
            echo "=== 验证 .app 内 tkinter 是否打包成功 ==="
            find "$APP" -name "*tkinter*" 2>/dev/null | head -20
            find "$APP" -name "_tkinter*" 2>/dev/null | head -5
            find "$APP" -name "libtcl*" -o -name "libtk*" 2>/dev/null | head -5
            xattr -dr com.apple.quarantine "$APP" 2>/dev/null || true

      # 6. 生成构建说明 + 打包 ZIP
      - run:
          name: Package dist into zip
          command: |
            set -e
            TS=$(date +"%Y%m%d_%H%M%S")
            VER=$(python3 -c "import re; c=open('report_generator.py',encoding='utf-8').read(); m=re.search(r'VERSION\s*=\s*\x22([^\x22]+)\x22', c); print(m.group(1) if m else 'Unknown')")
            ZIP="app-macos-arm64.zip"
            echo "应用版本: $VER"
            echo "ZIP 文件名: $ZIP"

            printf '%s\n' \
              "${PROJECT_NAME} macOS arm64 Build Info" \
              "========================================================" \
              "版本: $VER" \
              "构建时间: $(date '+%Y-%m-%d %H:%M:%S %Z')" \
              "macOS: $(sw_vers -productVersion)" \
              "Python: $(python3 --version | awk '{print $2}')" \
              "PyInstaller: $(pyinstaller --version 2>/dev/null || echo 'n/a')" \
              "目标架构: arm64 (Apple Silicon M4 Pro 原生)" \
              "========================================================" \
              "首次打开方法:" \
              "  方式1: 双击 .app 直接打开（已移除隔离属性）" \
              "  方式2: 若被阻止，请右键 .app -> 打开 -> 点击 打开" \
              "  方式3: 终端执行 xattr -dr com.apple.quarantine /path/to/${PROJECT_NAME}.app" \
              "========================================================" \
              > "$DIST_DIR/build_info.txt"
            cat "$DIST_DIR/build_info.txt"

            # 关键：-y 保留符号链接，否则 .app 结构会损坏
            cd "$DIST_DIR"
            zip -r -y "../$ZIP" . -x "*.pyc" "__pycache__/*"
            cd ..
            echo ""
            echo "=== ZIP 文件信息 ==="
            ls -lh "$ZIP"

      # 7. 上传构建产物到 Artifacts
      - store_artifacts:
          path: app-macos-arm64.zip
          destination: app-macos-arm64.zip

      # 额外：上传整个 dist 目录作为备用
      - store_artifacts:
          path: dist
          destination: dist

workflows:
  build:
    jobs:
      - build-macos-arm64
