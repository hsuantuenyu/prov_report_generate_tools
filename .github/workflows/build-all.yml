name: Build All Platforms

on:
  workflow_dispatch:
    inputs:
      python_version:
        description: 'Python 版本（两平台共用，推荐 3.11+）'
        required: true
        default: '3.11'
        type: choice
        options:
          - '3.10'
          - '3.11'
          - '3.12'
          - '3.13'
      platforms:
        description: '构建平台（全选 = 同时构建 Windows + macOS）'
        required: true
        default: '全部'
        type: choice
        options:
          - '全部'
          - '仅 Windows'
          - '仅 macOS (M1/M2 arm64)'
          - '仅 macOS (universal2)'
      upload_artifact:
        description: '上传构建产物到 Artifact'
        required: true
        default: true
        type: boolean
      artifact_retention_days:
        description: 'Artifact 保留天数'
        required: true
        default: '30'
        type: choice
        options:
          - '1'
          - '7'
          - '14'
          - '30'
          - '60'
          - '90'

env:
  PROJECT_NAME: 疾控中心下发报告生成工具
  DIST_DIR: dist

jobs:

  # ===== Windows x64 构建 =====
  build-windows:
    name: Build Windows x64
    runs-on: windows-latest
    if: ${{ github.event.inputs.platforms == '全部' || github.event.inputs.platforms == '仅 Windows' }}

    steps:
      - name: Checkout 源代码
        uses: actions/checkout@v4

      - name: 设置 Python ${{ github.event.inputs.python_version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ github.event.inputs.python_version }}
          architecture: 'x64'

      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install duckdb pandas openpyxl tkcalendar pyinstaller
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: 1

      - name: 构建兼容性检查
        run: python verify_build_env.py
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: 1

      - name: PyInstaller 构建
        run: python build_exe.py
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: 1

      - name: 验证 EXE 与架构
        run: |
          $EXE_PATH = Join-Path $env:DIST_DIR "$env:PROJECT_NAME.exe"
          if (-not (Test-Path $EXE_PATH)) { Write-Host "❌ EXE 未找到"; exit 1 }
          $sizeMB = [Math]::Round((Get-Item $EXE_PATH).Length / 1MB, 1)
          Write-Host "EXE 大小: ${sizeMB} MB"
          try {
              $ver = (Get-Item $EXE_PATH).VersionInfo
              Write-Host "ProductVersion: $($ver.ProductVersion)"
          } catch {}
          $bytes = [IO.File]::ReadAllBytes($EXE_PATH)
          $peOff = [BitConverter]::ToInt32($bytes, 0x3C)
          $mach = [BitConverter]::ToUInt16($bytes, $peOff + 4)
          if ($mach -ne 0x8664) { Write-Host "❌ 架构不符"; exit 1 }
          Write-Host "✅ Windows x64 架构验证通过"
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: 1

      - name: 打包 ZIP 并上传
        if: inputs.upload_artifact
        run: |
          $TS = Get-Date -Format "yyyyMMdd_HHmmss"
          $VER = python -c "import re; c=open('report_generator.py',encoding='utf-8').read(); m=re.search(r'VERSION\s*=\s*\x22([^\x22]+)\x22', c); print(m.group(1) if m else 'Unknown')"
          $ZIP = "${{ env.PROJECT_NAME }}_${VER}_Windows_x64_${TS}.zip"
          Write-Host "ZIP: $ZIP"
          Add-Content $env:GITHUB_ENV "APP_VERSION=$VER"
          Add-Content $env:GITHUB_ENV "ZIP_NAME=$ZIP"
          Set-Location $env:DIST_DIR
          Compress-Archive -Path .\* -DestinationPath ..\$ZIP -Force
          Set-Location ..
          # Build info
          @"
          ${{ env.PROJECT_NAME }} Windows x64 Build Info
          版本: $VER
          构建时间: $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss K')
          Python: $(python --version 2>&1)
          PyInstaller: $(pyinstaller --version)
          "@ | Set-Content build_info.txt -Encoding UTF8
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: 1

      - name: 上传 Artifact
        if: inputs.upload_artifact
        uses: actions/upload-artifact@v4
        with:
          name: Windows-x64-${{ env.APP_VERSION }}
          path: |
            ${{ env.ZIP_NAME }}
            build_info.txt
          retention-days: ${{ github.event.inputs.artifact_retention_days }}
          compression-level: 6

  # ===== macOS (Apple Silicon arm64) 构建 =====
  build-macos-arm64:
    name: Build macOS arm64 (M1/M2/M3)
    runs-on: macos-14
    if: ${{ github.event.inputs.platforms == '全部' || github.event.inputs.platforms == '仅 macOS (M1/M2 arm64)' }}

    steps:
      - name: Checkout 源代码
        uses: actions/checkout@v4

      - name: 显示 Runner 信息
        run: |
          echo "Runner: $(uname -m)"
          echo "macOS: $(sw_vers -productVersion)"

      - name: 设置 Python ${{ github.event.inputs.python_version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ github.event.inputs.python_version }}
          architecture: 'arm64'

      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install duckdb pandas openpyxl tkcalendar pyinstaller
        env:
          ARCHFLAGS: "-arch arm64"
          PIP_USE_PEP517: "1"
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: 1

      - name: 运行兼容性验证
        run: python verify_macos_build.py
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: 1

      - name: PyInstaller 构建
        env:
          TARGET_ARCH: 'arm64'
          ARCHFLAGS: "-arch arm64"
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: 1
        run: python build_exe.py

      - name: 验证 .app 架构
        run: |
          APP_BIN="$DIST_DIR/${{ env.PROJECT_NAME }}.app/Contents/MacOS/${{ env.PROJECT_NAME }}"
          if [ ! -f "$APP_BIN" ]; then echo "❌ APP 未找到"; exit 1; fi
          file "$APP_BIN"
          if ! file "$APP_BIN" | grep -q "arm64"; then echo "❌ 架构不符"; exit 1; fi
          echo "✅ Apple Silicon arm64 架构验证通过"
          xattr -dr com.apple.quarantine "$DIST_DIR/${{ env.PROJECT_NAME }}.app" 2>/dev/null || true

      - name: 打包 ZIP 并上传
        if: inputs.upload_artifact
        run: |
          TS=$(date +"%Y%m%d_%H%M%S")
          VER=$(python -c "import re; c=open('report_generator.py',encoding='utf-8').read(); m=re.search(r'VERSION\s*=\s*\x22([^\x22]+)\x22', c); print(m.group(1) if m else 'Unknown')")
          ZIP="${{ env.PROJECT_NAME }}_${VER}_macOS_arm64_M2_${TS}.zip"
          echo "ZIP: $ZIP"
          echo "APP_VERSION=$VER" >> $GITHUB_ENV
          echo "ZIP_NAME=$ZIP" >> $GITHUB_ENV
          cd "$DIST_DIR"
          zip -r "../$ZIP" ./* -x "*.pyc" "__pycache__/*"
          cd ..
          cat > build_info.txt <<EOF
          ${{ env.PROJECT_NAME }} macOS arm64 Build Info
          版本: $VER
          构建时间: $(date '+%Y-%m-%d %H:%M:%S %Z')
          macOS: $(sw_vers -productVersion)
          Python: $(python --version | awk '{print $2}')
          PyInstaller: $(pyinstaller --version)
          首次打开: 双击 .app 或右键→打开
          若提示隔离: xattr -dr com.apple.quarantine "/path/to/${{ env.PROJECT_NAME }}.app"
          EOF
          cat build_info.txt
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: 1

      - name: 上传 Artifact
        if: inputs.upload_artifact
        uses: actions/upload-artifact@v4
        with:
          name: macOS-arm64_M2-${{ env.APP_VERSION }}
          path: |
            ${{ env.ZIP_NAME }}
            build_info.txt
          retention-days: ${{ github.event.inputs.artifact_retention_days }}
          compression-level: 6

  # ===== macOS (universal2) 构建（可选，由 platforms 触发） =====
  build-macos-universal2:
    name: Build macOS universal2
    runs-on: macos-14
    if: ${{ github.event.inputs.platforms == '仅 macOS (universal2)' }}

    steps:
      - name: Checkout 源代码
        uses: actions/checkout@v4

      - name: 设置 Python ${{ github.event.inputs.python_version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ github.event.inputs.python_version }}
          architecture: 'arm64'

      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install duckdb pandas openpyxl tkcalendar pyinstaller
        env:
          ARCHFLAGS: "-arch arm64"
          PIP_USE_PEP517: "1"
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: 1

      - name: PyInstaller 构建（universal2）
        env:
          TARGET_ARCH: 'universal2'
          ARCHFLAGS: "-arch arm64 -arch x86_64"
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: 1
        run: python build_exe.py || true
        # universal2 对非 fat binary 的 .so 会报错，此处允许失败；若失败则退化为 arm64 单体打包

      - name: 验证 .app 架构
        run: |
          APP_BIN="$DIST_DIR/${{ env.PROJECT_NAME }}.app/Contents/MacOS/${{ env.PROJECT_NAME }}"
          if [ ! -f "$APP_BIN" ]; then echo "❌ APP 未找到"; exit 1; fi
          file "$APP_BIN"
          echo "架构: $(lipo -info "$APP_BIN" 2>/dev/null || true)"
          xattr -dr com.apple.quarantine "$DIST_DIR/${{ env.PROJECT_NAME }}.app" 2>/dev/null || true

      - name: 打包 ZIP 并上传
        if: inputs.upload_artifact
        run: |
          TS=$(date +"%Y%m%d_%H%M%S")
          VER=$(python -c "import re; c=open('report_generator.py',encoding='utf-8').read(); m=re.search(r'VERSION\s*=\s*\x22([^\x22]+)\x22', c); print(m.group(1) if m else 'Unknown')")
          ZIP="${{ env.PROJECT_NAME }}_${VER}_macOS_universal2_${TS}.zip"
          echo "APP_VERSION=$VER" >> $GITHUB_ENV
          echo "ZIP_NAME=$ZIP" >> $GITHUB_ENV
          cd "$DIST_DIR"
          zip -r "../$ZIP" ./* -x "*.pyc" "__pycache__/*"
          cd ..
          cat > build_info.txt <<EOF
          ${{ env.PROJECT_NAME }} macOS universal2 Build Info
          版本: $VER
          架构: arm64 + x86_64 (通用双架构)
          构建时间: $(date '+%Y-%m-%d %H:%M:%S %Z')
          EOF
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: 1

      - name: 上传 Artifact
        if: inputs.upload_artifact
        uses: actions/upload-artifact@v4
        with:
          name: macOS-universal2-${{ env.APP_VERSION }}
          path: |
            ${{ env.ZIP_NAME }}
            build_info.txt
          retention-days: ${{ github.event.inputs.artifact_retention_days }}
          compression-level: 6